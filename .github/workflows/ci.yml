name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  integration:
    name: backend (integration · pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      OPSPILOT_TEST_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Integration tests
        run: uv run pytest -m integration -q

  generator:
    name: data generator (determinism · verify · lint · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true

      # stdlib-only: no project sync, just an ephemeral 3.12 interpreter.
      - name: Build twice and diff (determinism)
        run: |
          uv run --python 3.12 python -m data.generator --out /tmp/gen-a
          uv run --python 3.12 python -m data.generator --out /tmp/gen-b
          diff -r /tmp/gen-a /tmp/gen-b

      - name: Verify a non-default seed also builds
        run: uv run --python 3.12 python -m data.generator --seed 7 --dry-run > /dev/null

      - name: Ruff lint + format
        run: |
          uvx ruff@0.16.5 check data
          uvx ruff@0.16.5 format --check data

      - name: Mypy
        run: uv run --python 3.12 --with mypy==2.3.1 mypy --config-file pyproject.toml data

      - name: Tests
        run: uv run --python 3.12 --with pytest pytest data/generator/tests -q

  # Phase 13 will add: security/static checks (bandit, pip-audit),
  # offline retrieval regression, Docker build + smoke tests, and a
  # separate scheduled workflow for the full paid evaluation benchmark.
